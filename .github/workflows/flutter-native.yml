name: Flutter native UI validation

on:
  push:
    branches:
      - feat/flutter-dart-migration-1.46.0
  pull_request:
    branches:
      - work/1.46.0-auditoria-funcoes-apk
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform runners without touching legacy Android project
        run: flutter create --project-name jarvis_nova --platforms=android,windows .
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-flutter-android-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  flutter-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform runners without touching legacy desktop project
        run: flutter create --project-name jarvis_nova --platforms=android,windows .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows
      - name: Publish Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-flutter-windows-debug
          path: flutter_app/build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 14
