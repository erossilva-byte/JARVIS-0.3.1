name: Flutter native UI validation

on:
  push:
    branches:
      - feat/flutter-dart-migration-1.46.0
      - feat/functional-integration-1.47.0
  pull_request:
    branches:
      - work/1.46.0-auditoria-funcoes-apk
      - feat/functional-integration-1.47.0
      - feat/flutter-dart-migration-1.46.0
      - main
  workflow_dispatch:

permissions:
  contents: read

# Push e pull_request do mesmo commit compartilham um único runner.
concurrency:
  group: flutter-native-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform runners without touching legacy Android project
        run: flutter create --project-name jarvis_nova --platforms=android,windows .
      - name: Set the production Android application identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          content = gradle.read_text()
          old_id = "com.example.jarvis_nova"
          new_id = "com.jarvis.nova"
          if old_id not in content:
              raise SystemExit(f"Identificador Android padrão não encontrado em {gradle}")
          gradle.write_text(content.replace(old_id, new_id))

          activity = Path("android/app/src/main/kotlin/com/example/jarvis_nova/MainActivity.kt")
          source = activity.read_text()
          source = source.replace("package com.example.jarvis_nova", "package com.jarvis.nova")
          target = Path("android/app/src/main/kotlin/com/jarvis/nova/MainActivity.kt")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source)
          activity.unlink()

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest.write_text(manifest.read_text().replace('android:label="jarvis_nova"', 'android:label="J.A.R.V.I.S. Nova"'))
          PY
          grep -q 'applicationId = "com.jarvis.nova"' android/app/build.gradle.kts
          grep -q 'namespace = "com.jarvis.nova"' android/app/build.gradle.kts
      - name: Install sherpa-onnx model tokenizer
        if: runner.os == 'Linux'
        run: python3 -m pip install --disable-pip-version-check sherpa-onnx==1.13.8 sentencepiece pypinyin
      - name: Download and verify sherpa-onnx Android runtime
        if: runner.os == 'Linux'
        run: python3 ../baixar_sherpa.py android/app
        working-directory: flutter_app
      - name: Prepare local KWS model assets
        if: runner.os == 'Linux'
        run: python3 ../preparar_kws.py android/app
        working-directory: flutter_app
      - name: Register native Kotlin KWS plugin and foreground service
        if: runner.os == 'Linux'
        run: python3 tool/prepare_android_kws.py android/app
        working-directory: flutter_app
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Verify APK identity and output
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo "APK Flutter gerado: $(du -h build/app/outputs/flutter-apk/app-debug.apk | cut -f1)"
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-flutter-android-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  flutter-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform runners without touching legacy desktop project
        run: flutter create --project-name jarvis_nova --platforms=android,windows .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows
      - name: Publish Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-flutter-windows-debug
          path: flutter_app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  # Check único para impedir avanço quando Android OU Windows falhar.
  advance-gate:
    name: advance-gate (Android + Windows)
    runs-on: ubuntu-latest
    needs:
      - flutter-android
      - flutter-windows
    if: always()
    steps:
      - name: Require both platform validations
        env:
          ANDROID_RESULT: ${{ needs.flutter-android.result }}
          WINDOWS_RESULT: ${{ needs.flutter-windows.result }}
        run: |
          echo "Android: ${ANDROID_RESULT}"
          echo "Windows: ${WINDOWS_RESULT}"
          test "${ANDROID_RESULT}" = "success"
          test "${WINDOWS_RESULT}" = "success"
          echo "GATE LIBERADO: Android e Windows passaram em análise, testes, build e publicação dos artefatos."
