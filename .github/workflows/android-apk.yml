name: Build JARVIS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'JARVIS-NOVA-1.4.5-fonte.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Extract source archive
        run: |
          mkdir -p source
          unzip -q JARVIS-NOVA-1.4.5-fonte.zip -d source
          echo "Extracted source tree:"
          find source -maxdepth 4 -type f \( -name package.json -o -name settings.gradle -o -name settings.gradle.kts -o -name gradlew -o -name capacitor.config.ts -o -name capacitor.config.json \) -print

      - name: Locate project root
        id: project
        shell: bash
        run: |
          PKG="$(find source -type f -name package.json -not -path '*/node_modules/*' -print -quit)"
          if [ -z "$PKG" ]; then
            echo "::error::No package.json found in source archive."
            exit 1
          fi
          ROOT="$(dirname "$PKG")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"
          ls -la "$ROOT"

      - name: Install JavaScript dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify Android project
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          if [ ! -d android ]; then
            echo "::error::Android project directory not found after dependency installation."
            exit 1
          fi
          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew is missing."
            exit 1
          fi
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Nova-1.4.5-debug-APK
          path: ${{ steps.project.outputs.root }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
