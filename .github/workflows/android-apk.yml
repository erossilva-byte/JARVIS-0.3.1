name: Build JARVIS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'JARVIS-NOVA-1.4.5-fonte-corrigido.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract source archive
        run: |
          mkdir -p source
          unzip -q JARVIS-NOVA-1.4.5-fonte-corrigido.zip -d source
          echo "Extracted source tree:"
          find source -maxdepth 4 -type f \( -name package.json -o -name settings.gradle -o -name settings.gradle.kts -o -name gradlew -o -name capacitor.config.ts -o -name capacitor.config.json \) -print

      - name: Locate project root
        id: project
        shell: bash
        run: |
          PKG="$(find source -type f -name package.json -not -path '*/node_modules/*' -print -quit)"
          if [ -z "$PKG" ]; then
            echo "::error::No package.json found in source archive."
            exit 1
          fi
          ROOT="$(dirname "$PKG")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"
          ls -la "$ROOT"

      - name: Install JavaScript dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -e
          echo "Project root: $PWD"
          echo "Preparing Capacitor web assets."
          mkdir -p www
          find . -maxdepth 1 -type f ! -path './package-lock.json' -exec cp -f -t www {} +
          for dir in assets css js img images icons fonts public; do
            if [ -d "$dir" ]; then
              cp -a "$dir" www/
            fi
          done
          if [ ! -f www/index.html ]; then
            echo "::error::index.html was not found; cannot package the app."
            find . -maxdepth 2 -type f -name index.html -print
            exit 1
          fi
          echo "Web assets prepared:"
          find www -maxdepth 2 -type f -print | head -80
          echo "Capacitor packages:"
          npm ls @capacitor/core @capacitor/cli @capacitor/android --depth=0 || true
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor config not found in project root."
            exit 1
          fi
          if [ ! -d android ]; then
            echo "Android platform missing; creating it."
            npx cap add android
          fi
          echo "Synchronizing Capacitor plugins and generated Gradle settings."
          npx cap sync android
          if [ ! -f android/gradlew ]; then
            echo "::error::Android Gradle wrapper is missing after Capacitor sync."
            find android -maxdepth 3 -type f -print || true
            exit 1
          fi
          if [ ! -f android/capacitor.settings.gradle ]; then
            echo "::error::capacitor.settings.gradle was not generated by cap sync."
            find android -maxdepth 2 -type f -print
            exit 1
          fi
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Nova-1.4.5-debug-APK
          path: ${{ steps.project.outputs.root }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
