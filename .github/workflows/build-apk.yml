name: Build e testes do J.A.R.V.I.S. Nova 1.4.6

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jarvis-nova-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testar e compilar APK debug 1.4.6
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java para o Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair código-fonte enviado ao repositório
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'JARVIS-NOVA-*.zip' -print | sort | tail -n 1)"
          if [ -n "$ZIP" ]; then
            mkdir -p /tmp/jarvis-source
            unzip -q "$ZIP" -d /tmp/jarvis-source
            if [ -f /tmp/jarvis-source/package.json ]; then
              SRC=/tmp/jarvis-source
            elif [ -f /tmp/jarvis-source/JARVIS-NOVA/package.json ]; then
              SRC=/tmp/jarvis-source/JARVIS-NOVA
            else
              SRC="$(find /tmp/jarvis-source -mindepth 2 -maxdepth 4 -type f -name package.json -print -quit | xargs -r dirname)"
            fi
            test -n "$SRC" && test -f "$SRC/package.json"
            find "$SRC" -mindepth 1 -maxdepth 1 ! -name '.github' -exec cp -a {} . \;
          fi
          test -f package.json || { echo 'Envie JARVIS-NOVA-*-fonte.zip para a raiz do repositório ou mantenha os fontes na raiz.'; exit 1; }

      - name: Instalar dependências Node
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Diagnosticar requisitos do validador
        run: |
          echo "=== Requisitos de workflow no validador ==="
          grep -n -B 8 -A 12 -E 'Workflow não inclui os recursos nativos/artefato atual|workflow|artefato|Jarvis.*\.java' tests/validate_project.py || true

      - name: Testes estáticos e regressão
        run: npm run test:all

      - name: Preparar os recursos web do aplicativo
        run: |
          mkdir -p www
          cp index.html style.css app.js apps.js www/

      - name: Gerar estrutura nativa do Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar identidade, permissões, versão e detector local
        id: native-patches
        run: |
          D=android/app/src/main/java/com/jarvis/nova
          mkdir -p "$D"
          # Copia todos os recursos Java nativos presentes no ZIP, incluindo plugins adicionados em versões futuras.
          find . -maxdepth 1 -type f -name '*.java' -print -exec cp -f {} "$D/" \;
          # Falha cedo se os componentes nativos essenciais não estiverem no código-fonte.
          for f in MainActivity.java JarvisBackgroundPlugin.java JarvisService.java JarvisUtilPlugin.java JarvisLocalAIPlugin.java JarvisAlarmReceiver.java JarvisAlarmScheduler.java JarvisBootReceiver.java JarvisNotificationListener.java; do
            test -s "$D/$f" || { echo "Recurso nativo ausente: $f"; exit 1; }
          done
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 patch_gradle.py android/app/build.gradle
          python3 patch_android_version.py android/app/build.gradle VERSAO.json
          python3 patch_visual.py android

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "Primeira compilação falhou; tentando novamente sem as personalizações de splash/ícone."
            python3 ../patch_visual.py . desfazer
            ./gradlew assembleDebug --no-daemon
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          ./gradlew --version | tee gradle-version.txt
          java -version 2> java-version.txt
          cat ../VERSAO.json

      - name: Publicar APK e checksum
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Nova-1.4.6-APK
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/apk-sha256.txt
            android/gradle-version.txt
            android/java-version.txt
            VERSAO.json
          retention-days: 14
