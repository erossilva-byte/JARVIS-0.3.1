name: Publicar pacote do PC (Windows)

# O mesmo código web do APK é empacotado com Electron. Este workflow é separado do
# Android de propósito: são dois instaladores independentes e um não deve derrubar o outro.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-nova-pc
  cancel-in-progress: false

jobs:
  linux:
    name: Empacotar Linux (AppImage + deb + tar.gz)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Três formatos de propósito: o AppImage precisa de FUSE 2, que o Ubuntu 22.04+
      # não instala por padrão (erro `dlopen(): error loading libfuse.so.2`), e o .deb
      # precisa de sudo. O tar.gz é a saída que roda em qualquer distro sem instalar nada.
      - name: Empacotar Linux
        run: npx electron-builder --linux AppImage deb tar.gz --publish never

      - name: Conferir AppImage, pacote deb e tar.gz
        shell: bash
        run: |
          ls -lh dist || true
          APPIMAGE=$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          DEB=$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)
          TARBALL=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$APPIMAGE" || { echo 'AppImage não foi gerado.' >&2; exit 1; }
          test -n "$DEB" || { echo 'Pacote .deb não foi gerado.' >&2; exit 1; }
          test -n "$TARBALL" || { echo 'Pacote tar.gz não foi gerado.' >&2; exit 1; }
          for f in "$APPIMAGE" "$DEB" "$TARBALL"; do
            BYTES=$(wc -c < "$f")
            echo "$f · $BYTES bytes"
            test "$BYTES" -gt 20000000 || { echo "Artefato pequeno demais (possível stub): $f" >&2; exit 1; }
          done
          # O tar.gz só serve se trouxer o executável e a interface; conferir por dentro
          # evita publicar um pacote vazio que abre e fecha sozinho.
          tar -tzf "$TARBALL" | grep -E '(^|/)jarvis-nova$' || { echo 'tar.gz sem o executável jarvis-nova.' >&2; exit 1; }
          tar -tzf "$TARBALL" | grep -E '(^|/)resources/app.asar$' || { echo 'tar.gz sem resources/app.asar.' >&2; exit 1; }
          chmod +x "$APPIMAGE"

      - name: Guardar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-nova-linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

      - name: Anexar Linux ao release da tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # Sem `body`: as notas do release vêm de VERSAO.json pela esteira do
          # APK. Definir texto aqui apagaria essas notas ao anexar o Linux.
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  windows:
    name: Instalador e portátil do J.A.R.V.I.S. Nova (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Chave privada Ed25519 que assina o manifesto de atualização. Vem do
      # segredo do repositório, nunca do código; o app só tem a pública.
      CHAVE_ATUALIZACAO: ${{ secrets.CHAVE_ATUALIZACAO_PRIVADA }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Conferir os fontes web obrigatórios
        shell: bash
        run: |
          for f in index.html style.css app.js pc.js hermes.js plataforma.js memoria_regras.js memoria.js bloqueio.js modo_visita.js voz_pc.js atualizacao_pc.js platforms/desktop/atualizacao-publica.pem orbita.js cad.js vendor/three.min.js platforms/desktop/main.js platforms/desktop/arquivos.js platforms/desktop/cad_pc.js platforms/desktop/memoria_pasta.js platforms/desktop/cofre_chaves.js; do
            test -s "$f" || { echo "Falta $f: o pacote do PC sairia incompleto."; exit 1; }
          done

      - name: Instalar dependências
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Verificar sintaxe dos módulos do desktop
        run: |
          node --check platforms/desktop/main.js
          node --check app.js

      - name: Testar motores de arquivos e CAD do PC
        shell: bash
        run: |
          node --check pc.js
          node --check platforms/desktop/arquivos.js
          node --check platforms/desktop/cad_pc.js
          node tests/test_pc_arquivos.js
          node tests/test_pc_cad.js

      - name: Empacotar Windows (instalador NSIS + portátil)
        run: npx electron-builder --win nsis portable --publish never

      - name: Conferir instalador e portátil (nunca publicar stub)
        shell: bash
        run: |
          ls -lh dist || true
          SETUP=$(find dist -maxdepth 1 -type f -name '*Setup*.exe' -print -quit)
          PORTATIL=$(find dist -maxdepth 1 -type f -name '*.exe' ! -name '*Setup*' -print -quit)
          test -n "$SETUP" || { echo 'Instalador NSIS não foi gerado.' >&2; exit 1; }
          test -n "$PORTATIL" || { echo 'Executável portátil não foi gerado.' >&2; exit 1; }
          # O electron-builder deixa um stub de ~160 kB quando falha no meio; exigir tamanho
          # mínimo impede publicar um instalador que não instala nada.
          for f in "$SETUP" "$PORTATIL"; do
            BYTES=$(wc -c < "$f")
            echo "$f · $BYTES bytes"
            test "$BYTES" -gt 20000000 || { echo "Artefato pequeno demais (possível stub): $f" >&2; exit 1; }
          done
          grep -a -q 'Nullsoft' "$SETUP" || { echo 'O Setup.exe não é um instalador NSIS válido.' >&2; exit 1; }

      - name: Gerar checksums
        shell: bash
        run: |
          cd dist
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      # Numa tag não existe release sem manifesto assinado: o app recusaria a
      # atualização e o instalador sairia sem como ser conferido.
      - name: Conferir a versão da tag e a chave de assinatura
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSAO" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não corresponde à versão $VERSAO do package.json."
            exit 1
          fi
          if [ -z "$CHAVE_ATUALIZACAO" ]; then
            echo "::error::Falta o segredo CHAVE_ATUALIZACAO_PRIVADA: sem ele o atualizacao.json não seria assinado e o app recusaria a atualização."
            exit 1
          fi
          echo "Versão $VERSAO e chave de assinatura presentes."

      - name: Assinar o manifesto de atualização
        if: env.CHAVE_ATUALIZACAO != ''
        shell: bash
        run: |
          set -euo pipefail
          ARQ="$RUNNER_TEMP/atualizacao-privada.pem"
          umask 077
          printf '%s\n' "$CHAVE_ATUALIZACAO" > "$ARQ"
          chmod 600 "$ARQ"
          VERSAO=$(node -p "require('./package.json').version")
          # As notas do manifesto saem do CHANGELOG, para o painel do app mostrar
          # o que mudou sem depender de internet.
          node -e "const fs=require('fs');const A=require('./atualizacao_pc.js');const n=A.notasDaVersao(fs.readFileSync('CHANGELOG.md','utf8'),process.argv[1]);fs.writeFileSync(process.argv[2],n.notas.map(function(x){return '- '+x;}).join('\n')+'\n');" "$VERSAO" "$RUNNER_TEMP/notas.txt"
          node tools/assinar_atualizacao.js --pasta dist --chave "$ARQ" --versao "$VERSAO" --canal estavel --notas "$RUNNER_TEMP/notas.txt"

      # Confere com a chave pública embutida no app, não com a chave que acabou
      # de assinar: se as duas não forem o mesmo par, o release para aqui.
      - name: Conferir a assinatura com a chave pública do app
        if: env.CHAVE_ATUALIZACAO != ''
        shell: bash
        run: node tools/conferir_atualizacao.js dist 0.0.1 estavel

      - name: Apagar a chave privada do disco do runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/atualizacao-privada.pem" "$RUNNER_TEMP/notas.txt"

      - name: Guardar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-nova-pc
          path: |
            dist/*.exe
            dist/*.sha256
            dist/atualizacao.json
            dist/atualizacao.json.sig
            dist/*.zip
            dist/win-unpacked/**
            dist/*.yml
          if-no-files-found: error

      - name: Anexar ao release da tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.sha256
            dist/atualizacao.json
            dist/atualizacao.json.sig
            dist/*.zip
            dist/*.yml
          generate_release_notes: false
          body: |
            Pacote do **PC (Windows)** do J.A.R.V.I.S. Nova, gerado do mesmo código web do APK.

            - `J.A.R.V.I.S. Nova Setup <versão>.exe` — instalador (NSIS).
            - `J.A.R.V.I.S. Nova <versão>.exe` — executável portátil, sem instalação.
            - `atualizacao.json` e `atualizacao.json.sig` — manifesto assinado
              (Ed25519) que o app confere em Ajustes ▸ Informações ▸ “Conferir
              atualização baixada…”. Baixe os dois junto do instalador.

            O Windows pode exibir aviso do SmartScreen porque o executável não é assinado
            digitalmente. Instalar apenas a partir deste release.

            Diferenças conhecidas em relação ao Android: câmera do celular, biometria do
            aparelho, notificações e serviços em segundo plano não existem no desktop; o app
            informa isso em vez de simular. Memória/Obsidian funciona por arquivos Markdown,
            e o assistente tem acesso a arquivos, pastas e status do PC.
