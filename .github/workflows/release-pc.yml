name: Publicar pacote do PC (Windows)

# O mesmo código web do APK é empacotado com Electron. Este workflow é separado do
# Android de propósito: são dois instaladores independentes e um não deve derrubar o outro.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-nova-pc
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador e portátil do J.A.R.V.I.S. Nova (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Conferir os fontes web obrigatórios
        shell: bash
        run: |
          for f in index.html style.css app.js pc.js hermes.js plataforma.js memoria.js orbita.js cad.js vendor/three.min.js platforms/desktop/main.js platforms/desktop/arquivos.js platforms/desktop/cad_pc.js; do
            test -s "$f" || { echo "Falta $f: o pacote do PC sairia incompleto."; exit 1; }
          done

      - name: Instalar dependências
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Verificar sintaxe dos módulos do desktop
        run: |
          node --check platforms/desktop/main.js
          node --check app.js

      - name: Testar motores de arquivos e CAD do PC
        shell: bash
        run: |
          node --check pc.js
          node --check platforms/desktop/arquivos.js
          node --check platforms/desktop/cad_pc.js
          node tests/test_pc_arquivos.js
          node tests/test_pc_cad.js

      - name: Empacotar Windows (instalador NSIS + portátil)
        run: npx electron-builder --win nsis portable --publish never

      - name: Conferir instalador e portátil (nunca publicar stub)
        shell: bash
        run: |
          ls -lh dist || true
          SETUP=$(find dist -maxdepth 1 -type f -name '*Setup*.exe' -print -quit)
          PORTATIL=$(find dist -maxdepth 1 -type f -name '*.exe' ! -name '*Setup*' -print -quit)
          test -n "$SETUP" || { echo 'Instalador NSIS não foi gerado.' >&2; exit 1; }
          test -n "$PORTATIL" || { echo 'Executável portátil não foi gerado.' >&2; exit 1; }
          # O electron-builder deixa um stub de ~160 kB quando falha no meio; exigir tamanho
          # mínimo impede publicar um instalador que não instala nada.
          for f in "$SETUP" "$PORTATIL"; do
            BYTES=$(wc -c < "$f")
            echo "$f · $BYTES bytes"
            test "$BYTES" -gt 20000000 || { echo "Artefato pequeno demais (possível stub): $f" >&2; exit 1; }
          done
          grep -a -q 'Nullsoft' "$SETUP" || { echo 'O Setup.exe não é um instalador NSIS válido.' >&2; exit 1; }

      - name: Gerar checksums
        shell: bash
        run: |
          cd dist
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      - name: Guardar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-nova-pc
          path: |
            dist/*.exe
            dist/*.sha256
            dist/*.zip
            dist/win-unpacked/**
            dist/*.yml
          if-no-files-found: error

      - name: Anexar ao release da tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.sha256
            dist/*.zip
            dist/*.yml
          generate_release_notes: false
          body: |
            Pacote do **PC (Windows)** do J.A.R.V.I.S. Nova, gerado do mesmo código web do APK.

            - `J.A.R.V.I.S. Nova Setup <versão>.exe` — instalador (NSIS).
            - `J.A.R.V.I.S. Nova <versão>.exe` — executável portátil, sem instalação.

            O Windows pode exibir aviso do SmartScreen porque o executável não é assinado
            digitalmente. Instalar apenas a partir deste release.

            Diferenças conhecidas em relação ao Android: câmera do celular, biometria do
            aparelho, notificações e serviços em segundo plano não existem no desktop; o app
            informa isso em vez de simular. Memória/Obsidian funciona por arquivos Markdown,
            e o assistente tem acesso a arquivos, pastas e status do PC.
