name: J.A.R.V.I.S. Nova — auditoria Android e Windows

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'work/**'
    paths:
      - '**.js'
      - '**.css'
      - '**.html'
      - '**.java'
      - '**.py'
      - '**.json'
      - '**.gradle'
      - '**.properties'
      - '.github/workflows/**'
      - 'tests/**'
      - 'platforms/**'
      - 'ci/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-audit-v9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Testes Android API 35 (emulador x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK sem pacote legado
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'

      - name: Instalar dependências
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Preparar assinatura fixa de CI
        run: |
          test -s ci/debug.keystore
          mkdir -p "$HOME/.android"
          cp ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Preparar recursos web
        run: |
          mkdir -p www
          cp index.html style.css app.js apps.js hermes.js plataforma.js memoria.js orbita.js cad.js visao.js pessoas.js www/
          cp avatar.js interface.css core.css www/
          cp identidade.js identidade_ui.js escuta.js agentes.js sistema.js plano.js interface.js www/
          cp core.js core_ui.js aprendizado.js aprendizado_ui.js arquivos_dev.js voz_motor.js humor.js www/
          mkdir -p www/vendor
          cp vendor/three.min.js www/vendor/three.min.js

      - name: Gerar projeto Capacitor Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          python3 baixar_sherpa.py android/app
          D=android/app/src/main/java/com/jarvis/nova
          mkdir -p "$D"
          find . -maxdepth 1 -type f -name '*.java' -exec cp -f {} "$D/" \;
          for f in MainActivity.java JarvisAtivacao.java JarvisBackgroundPlugin.java JarvisService.java JarvisUtilPlugin.java JarvisLocalAIPlugin.java JarvisSeguranca.java JarvisUpdatePlugin.java JarvisVozPlugin.java JarvisMusicaPlugin.java JarvisMusicaService.java JarvisAlarmReceiver.java JarvisAlarmScheduler.java JarvisBootReceiver.java JarvisNotificationListener.java JarvisPrefs.java JarvisWatchdog.java JarvisOuvirReceiver.java JarvisWakeBus.java JarvisAcessibilidade.java JarvisAcessibilidadePlugin.java; do
            test -s "$D/$f" || { echo "Classe nativa ausente: $f"; exit 1; }
          done
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 patch_gradle.py android/app/build.gradle
          python3 patch_android_version.py android/app/build.gradle VERSAO.json
          python3 patch_visual.py android

      - name: Testes estáticos e regressão
        run: npm run test:all

      - name: Compilar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Instalar GNU coreutils para timeouts no macOS
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          command -v gtimeout

      - name: Inicializar emulador e testar instalação, abertura e estabilidade
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            mkdir -p "$GITHUB_WORKSPACE/artifacts/android"
            gtimeout 60s adb wait-for-device
            adb devices -l | tee "$GITHUB_WORKSPACE/artifacts/android/adb-devices.txt"
            gtimeout 20s adb shell settings put global animator_duration_scale 0
            gtimeout 20s adb shell settings put global transition_animation_scale 0
            gtimeout 20s adb shell settings put global window_animation_scale 0
            gtimeout 20s adb logcat -c
            gtimeout 60s adb install -r "$APK"
            gtimeout 30s adb shell monkey -p com.jarvis.nova 1
            sleep 35
            APP_PID="$(gtimeout 20s adb shell pidof com.jarvis.nova 2>&1 || true)"
            printf '%s\n' "$APP_PID" | tee "$GITHUB_WORKSPACE/artifacts/android/app-pid.txt"
            gtimeout 30s adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/artifacts/android/logcat.txt" || true
            gtimeout 30s adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/artifacts/android/activities.txt" 2>&1 || true
            gtimeout 20s adb shell uiautomator dump /sdcard/jarvis-window.xml || true
            gtimeout 20s adb pull /sdcard/jarvis-window.xml "$GITHUB_WORKSPACE/artifacts/android/window.xml" || true
            gtimeout 20s adb exec-out screencap -p > "$GITHUB_WORKSPACE/artifacts/android/home.png" || true
            if [ -z "$APP_PID" ]; then
              echo "O processo com.jarvis.nova não permaneceu ativo após a inicialização." >&2
              exit 1
            fi
            if grep -E -i 'FATAL EXCEPTION|Fatal signal|ANR in com\.jarvis\.nova' "$GITHUB_WORKSPACE/artifacts/android/logcat.txt"; then
              echo "Crash/ANR detectado durante o smoke test." >&2
              exit 1
            fi
            test -s "$GITHUB_WORKSPACE/artifacts/android/home.png"

      - name: Coletar logs mesmo em caso de falha
        if: always()
        run: |
          mkdir -p artifacts/android
          adb devices -l > artifacts/android/adb-devices-final.txt 2>&1 || true
          gtimeout 20s adb logcat -d -v threadtime > artifacts/android/logcat-final.txt 2>&1 || true
          gtimeout 15s adb shell dumpsys meminfo com.jarvis.nova > artifacts/android/meminfo.txt 2>&1 || true
          gtimeout 15s adb shell dumpsys activity activities > artifacts/android/activities-final.txt 2>&1 || true

      - name: Publicar evidências Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-api35-evidencias
          path: |
            artifacts/android/
            android/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 30

  windows-build:
    name: Compilação Windows
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Testes de sintaxe e módulos compartilhados
        run: npm run test:syntax

      - name: Testes específicos do Windows
        shell: pwsh
        run: |
          node --check platforms/desktop/main.js
          node --check platforms/desktop/preload.js
          node --check platforms/desktop/arquivos.js
          node --check platforms/desktop/cad_pc.js
          node --check pc.js
          node tests/test_pc_arquivos.js
          node tests/test_pc_cad.js
          python tests/test_arquivos_sistema.py
          python tests/test_pc_windows.py

      - name: Gerar instalador Windows
        run: npm run dist:win -- --publish never

      - name: Publicar artefatos Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-build
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: warn
          retention-days: 30
