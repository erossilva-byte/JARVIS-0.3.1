name: Publicar release do J.A.R.V.I.S. Nova
# Versão publicada: 1.45.0 — confira VERSAO.json antes de criar a tag.
# Notas publicadas: o passo "Publicar release com o APK" gera o texto a partir de VERSAO.json.
# A linha 1.46.0 adiciona KWS acústico sherpa-onnx no próprio processo, sem SpeechRecognizer ou fallback de rede.
# O modelo KWS GigaSpeech é inglês: a palavra Jarvis é configurada como hotword e requer teste de sotaque PT-BR.
# Novidades da 1.45.0: tela de bloqueio com biometria forte do Android, leitura NFC real,
# modos combinados (biometria/NFC/PIN), central completa em Ajustes ▸ Segurança, histórico sem
# segredos e PIN em PBKDF2 com migração do hash antigo. NFC é conveniência: UID pode ser clonado.
# Novidades da 1.42.8: contexto visual da sessão, acompanhamento ("ele", "quanto custa"),
# procedência confirmado/loja/estimado, marca só com evidência legível, OCR como dado e ponte
# de componentes com a base elétrica; sem chave de IA não há medição de precisão.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-nova-release
  cancel-in-progress: false

jobs:
  release:
    name: Compilar APK e publicar release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java para o Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar tokenizer oficial do sherpa-onnx
        run: python3 -m pip install --upgrade pip sherpa-onnx==1.13.8

      - name: Garantir Android SDK 35
        run: |
          SDKM="$(command -v sdkmanager || true)"
          [ -n "$SDKM" ] || SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Verificar código-fonte na raiz
        run: |
          test -f package.json || { echo 'Código-fonte ausente: mantenha package.json na raiz do repositório.'; exit 1; }

      - name: Instalar dependências Node
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Fixar assinatura de debug do CI (obrigatória para o auto-update)
        run: |
          test -s ci/debug.keystore || { echo 'ci/debug.keystore ausente.'; exit 1; }
          mkdir -p "$HOME/.android"
          cp ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Preparar os recursos web do aplicativo
        run: |
          mkdir -p www
          # Todo recurso web do app precisa estar aqui: sem hermes.js o app.js recusa
          # iniciar ("Núcleo Hermes ausente") e o APK publicado sairia inútil.
          cp index.html style.css app.js apps.js hermes.js plataforma.js memoria.js orbita.js cad.js eletrica.js projetista.js pc.js cad_projeto.js visao.js visao_contexto.js seguranca.js pessoas.js utilidades.js cultura.js briefing.js jogos.js utilidades_ui.js www/
          cp avatar.js www/
          cp interface.css www/
          cp core.css www/
          cp identidade.js identidade_ui.js escuta.js agentes.js sistema.js plano.js interface.js www/
          cp core.js core_ui.js www/
          cp aprendizado.js aprendizado_ui.js www/
          cp arquivos_dev.js www/
          cp voz_motor.js fala.js audio_pcm.js www/
          cp cognicao.js www/
          cp humor.js www/
          cp identidade.js www/
          cp identidade_ui.js www/
          mkdir -p www/vendor
          cp vendor/three.min.js www/vendor/three.min.js

      - name: Limpar projeto Android gerado
        run: rm -rf android

      - name: Gerar estrutura nativa do Android
        run: |
          npx cap add android
          npx cap sync android
          python3 preparar_kws.py android/app

      - name: Guardar o runtime de voz neural em cache
        uses: actions/cache@v4
        with:
          path: android/app/libs
          key: sherpa-onnx-1.13.8-aar-v1

      - name: Baixar bibliotecas nativas de voz (sherpa-onnx)
        run: python3 baixar_sherpa.py android/app

      - name: Aplicar identidade, permissões e versão
        run: |
          D=android/app/src/main/java/com/jarvis/nova
          mkdir -p "$D"
          find . -maxdepth 1 -type f -name '*.java' -exec cp -f {} "$D/" \;
          # Lista alinhada com o workflow de build: toda classe nativa da raiz é obrigatória.
          for f in MainActivity.java JarvisAtivacao.java JarvisBackgroundPlugin.java JarvisService.java JarvisUtilPlugin.java JarvisLocalAIPlugin.java JarvisSeguranca.java JarvisUpdatePlugin.java JarvisVozPlugin.java JarvisMusicaPlugin.java JarvisMusicaService.java JarvisKwsEngine.java JarvisAlarmReceiver.java JarvisAlarmScheduler.java JarvisBootReceiver.java JarvisNotificationListener.java JarvisPrefs.java JarvisWatchdog.java JarvisOuvirReceiver.java JarvisWakeBus.java JarvisAcessibilidade.java JarvisAcessibilidadePlugin.java; do
            test -s "$D/$f" || { echo "Recurso nativo ausente: $f"; exit 1; }
          done
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 patch_gradle.py android/app/build.gradle
          python3 patch_android_version.py android/app/build.gradle VERSAO.json
          python3 patch_visual.py android

      - name: Testes estáticos e regressão
        run: npm run test:all

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Conferir tag e nomear o APK da release
        id: versao
        run: |
          V=$(python3 -c "import json;print(json.load(open('VERSAO.json'))['version'])")
          C=$(python3 -c "import json;print(json.load(open('VERSAO.json'))['versionCode'])")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$V" ]; then
              echo "Tag $GITHUB_REF_NAME não bate com VERSAO.json ($V). Corrija antes de publicar." >&2
              exit 1
            fi
          fi
          APK="jarvis-nova-${V}-${C}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "${APK%.apk}.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=${APK%.apk}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publicar release com o APK
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json;print(json.load(open('VERSAO.json'))['notas'])" > notas-release.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notas-release.md
          else
            gh release create "$GITHUB_REF_NAME" --title "J.A.R.V.I.S. Nova ${GITHUB_REF_NAME#v}" --notes-file notas-release.md
          fi
          gh release upload "$GITHUB_REF_NAME" "${{ steps.versao.outputs.apk }}" "${{ steps.versao.outputs.sha }}" --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name]'
