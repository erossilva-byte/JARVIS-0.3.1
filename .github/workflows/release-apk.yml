name: Publicar release do J.A.R.V.I.S. Nova

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-nova-release
  cancel-in-progress: false

jobs:
  release:
    name: Compilar APK e publicar release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java para o Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Garantir Android SDK 35
        run: |
          SDKM="$(command -v sdkmanager || true)"
          [ -n "$SDKM" ] || SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Verificar código-fonte na raiz
        run: |
          test -f package.json || { echo 'Código-fonte ausente: mantenha package.json na raiz do repositório.'; exit 1; }

      - name: Instalar dependências Node
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Fixar assinatura de debug do CI (obrigatória para o auto-update)
        run: |
          test -s ci/debug.keystore || { echo 'ci/debug.keystore ausente.'; exit 1; }
          mkdir -p "$HOME/.android"
          cp ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Testes estáticos e regressão
        run: npm run test:all

      - name: Preparar os recursos web do aplicativo
        run: |
          mkdir -p www
          # Todo recurso web do app precisa estar aqui: sem hermes.js o app.js recusa
          # iniciar ("Núcleo Hermes ausente") e o APK publicado sairia inútil.
          cp index.html style.css app.js apps.js hermes.js plataforma.js memoria.js orbita.js cad.js visao.js pessoas.js www/
          cp arquivos_dev.js www/
          cp voz_motor.js www/
          cp humor.js www/
          mkdir -p www/vendor
          cp vendor/three.min.js www/vendor/three.min.js

      - name: Gerar estrutura nativa do Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Guardar o runtime de voz neural em cache
        uses: actions/cache@v4
        with:
          path: android/app/libs
          key: sherpa-onnx-1.13.8-aar-v1

      - name: Baixar bibliotecas nativas de voz (sherpa-onnx)
        run: python3 baixar_sherpa.py android/app

      - name: Aplicar identidade, permissões e versão
        run: |
          D=android/app/src/main/java/com/jarvis/nova
          mkdir -p "$D"
          find . -maxdepth 1 -type f -name '*.java' -exec cp -f {} "$D/" \;
          # Lista alinhada com o workflow de build: toda classe nativa da raiz é obrigatória.
          for f in MainActivity.java JarvisAtivacao.java JarvisBackgroundPlugin.java JarvisService.java JarvisUtilPlugin.java JarvisLocalAIPlugin.java JarvisSeguranca.java JarvisUpdatePlugin.java JarvisVozPlugin.java JarvisMusicaPlugin.java JarvisMusicaService.java JarvisAlarmReceiver.java JarvisAlarmScheduler.java JarvisBootReceiver.java JarvisNotificationListener.java JarvisPrefs.java JarvisWatchdog.java JarvisOuvirReceiver.java JarvisWakeBus.java; do
            test -s "$D/$f" || { echo "Recurso nativo ausente: $f"; exit 1; }
          done
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 patch_gradle.py android/app/build.gradle
          python3 patch_android_version.py android/app/build.gradle VERSAO.json
          python3 patch_visual.py android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Conferir tag e nomear o APK da release
        id: versao
        run: |
          V=$(python3 -c "import json;print(json.load(open('VERSAO.json'))['version'])")
          C=$(python3 -c "import json;print(json.load(open('VERSAO.json'))['versionCode'])")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$V" ]; then
              echo "Tag $GITHUB_REF_NAME não bate com VERSAO.json ($V). Corrija antes de publicar." >&2
              exit 1
            fi
          fi
          APK="jarvis-nova-${V}-${C}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "${APK%.apk}.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=${APK%.apk}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publicar release com o APK
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.versao.outputs.apk }}
            ${{ steps.versao.outputs.sha }}
          generate_release_notes: true
          body: |
            APK do J.A.R.V.I.S. Nova assinado com a assinatura fixa de CI (ci/debug.keystore),
            que é a assinatura esperada pelo atualizador embutido no app.
            Instale a partir deste release para que as próximas atualizações funcionem.
            Confira o checksum em `${{ steps.versao.outputs.sha }}`.

            **Vozes neurais (opcional):** a partir da 1.9.0 o app pode falar com Piper (pt-BR)
            ou Kokoro (vozes britânicas) rodando no próprio aparelho. Os modelos são baixados
            dentro do app (67 MB e 132 MB) em Ajustes ▸ Voz; nada disso vai no APK.

            **Novidades da 1.10.0:** personalidade centralizada (`PERSONALIDADE`), aviso falado
            “analisando sua voz” na ativação (conferência uma vez por sessão), chamadas realmente
            completadas (`ACTION_CALL`), player que toca a música do próprio aparelho e proteção
            contra exceções que antes fechavam o app.

            **Novidades da 1.27.0:** o humor virou **personalidade permanente**. O prompt abre com regras obrigatórias,
            proíbe aberturas neutras e exige uma observação contextual integrada em toda resposta; um banco por assunto
            evita repetir ângulos e silencia o humor em emergência, saúde, luto, violência, segurança e dinheiro perdido.
            Os padrões subiram para 90% (sarcasmo 90, ironia 90, brincadeiras 85, espontaneidade 85, provocação 70,
            formalidade 15) e a IA local recebe as mesmas regras. A voz ganhou prosódia por frase: ironia mais grave e
            lenta, exclamação mais viva, pergunta com subida de tom.

            **Novidades da 1.26.0:** reconhecimento de **locutor local**. O vetor experimental de 6 números deu lugar a
            um motor com VAD, FFT/mel, pitch por HPS, formantes, prosódia e 59 dimensões; a comparação pondera espectro,
            formantes e pitch, e responde **compatível**, **diferente** ou **inconclusivo** (nunca adivinha). O cadastro
            é guiado em três frases, exige consentimento, recusa áudio curto/saturado/ruidoso e guarda **apenas o vetor**,
            nunca o áudio. Até cinco perfis, limiar ajustável, identificação entre perfis com margem, medidor de nível,
            relatório de qualidade e diagnóstico. A captura permite cancelar eco, suprimir ruído e ativar AGC.

            **Novidades da 1.25.0:** nova aba **Desenvolvimento de Arquivos**, separada da conversa: recebe vários
            arquivos ou um projeto `.zip`,
            mostra idioma/tamanho/linhas e analisa de verdade JSON inválido, importações ausentes, duplicatas,
            segredos, marcadores de conflito e símbolos desbalanceados — sem executar o código recebido. Correções
            (JSON, CRLF/LF, espaços, BOM) guardam o original e entram no histórico; a criação gera **PDF, DOCX, XLSX,
            CSV, JSON e ZIP** com estrutura real, e “crie um projeto Python chamado X” monta README, `main.py` e
            `requirements.txt`. Exportação individual ou do projeto em `.zip`. A comparação de voz agora responde
            compatível, diferente ou inconclusivo, com margem em torno do limiar e o aviso de que timbre não é prova
            de identidade. Pessoas, memória, visão, IA local e Windows seguem intactos.

            **Novidades da 1.24.0:** a **IA local** deixou de fechar o aplicativo. O runtime MediaPipe subiu de
            `0.10.14` para **`0.10.24`** porque a versão antiga não suporta Gemma 3 e abortava o processo ao abrir
            o `.task` (SIGABRT nativo, invisível para try/catch Java). O prompt local agora cabe nos 2048 tokens do
            modelo (persona condensada + histórico curto, teto de 6000 caracteres), a engine é fechada apenas depois
            da geração e na mesma thread, o backend é CPU e as respostas voltam na UI thread. A área de IA local mostra
            importado ≠ validado ≠ testado ≠ pronto, mede o tempo do teste, ganhou **Descarregar** e recusa GGUF
            renomeado com mensagem clara. Nenhum provedor remoto, voz, memória ou recurso do Windows foi alterado.

            **Novidades da 1.23.1:** corrigido o erro `store is not defined` que abortava a
            inicialização (o bloco da opção de efeitos estava fora do escopo do app); corrigido o texto
            vertical do diagnóstico (nome com largura mínima e quebra em duas linhas, selo que não encolhe);
            e o chat ganhou **anexos reais** — clipe no rodapé, seletor nativo do Android/Windows, lista com
            nome/tipo/tamanho, remoção e envio do conteúdo de texto para a IA. Imagem e binário são
            identificados com a limitação escrita. **Ainda não incluído:** geração de .cad do CADe SIMU,
            automação de janelas/aplicativos do Windows e alarme do Windows.

            **Novidades da 1.23.0:** reformulação visual holográfica. O núcleo em HUD ganhou camadas
            reais em profundidade (halo atrás, aro à frente, marca e telemetria acima) e inclina com o
            ponteiro, produzindo paralaxe de verdade; os painéis entram em perspectiva pela borda direita e
            o scrim dissolve o fundo; cartões de ajustes, diagnóstico, pessoas, memória e arquivos passaram a
            compartilhar o mesmo vidro com filete de luz e elevação; botões afundam ao toque; o balão de
            carregamento tem varredura e o diagnóstico confirma ou alerta conforme o resultado real. Nova opção
            **Reduzir efeitos visuais** em Ajustes ▸ Voz, persistida no aparelho, além do respeito a
            `prefers-reduced-motion`. Nenhuma função, tela ou integração foi removida.

            **Novidades da 1.22.0:** o Núcleo 3D voltou a funcionar no celular e no PC — o tamanho
            das partículas estava ~46x maior do que devia e saturava a tela em branco; agora respeita o
            pixel ratio, tem máscara circular, recupera contexto WebGL perdido e se redimensiona com o
            painel e a rotação. O serviço em primeiro plano ganhou uma segunda tentativa mínima de
            `startForeground()` (fim do crash de timeout), o player limpa o estado ao encerrar,
            `minSdkVersion` está coerente e o app bloqueia tráfego HTTP.

            **Novidades da 1.17.0:** o núcleo **Órbita** virou uma cena 3D de verdade — partículas com shader próprio, três anéis em planos diferentes e miolo luminoso renderizados na GPU com Three.js empacotado no app (sem CDN) —, com animação por delta time, resolução adaptativa, pausa com a tela oculta e fallback em Canvas 2D quando não há WebGL.

            **Novidades da 1.16.0:** o Núcleo ganhou um segundo estilo — o **plasma**, um anel de
            energia irregular no desenho da referência — escolhido em Ajustes ▸ Voz ▸ Aparência do
            núcleo, com prévia na própria tela; a troca vale na hora, fica salva e a abertura nasce
            com o mesmo estilo. A animação tem giro, deformação do contorno, respiração e pulso em
            camadas e reage ao nível do microfone, com pausa quando a tela sai de vista.

            **Novidades da 1.14.0:** escuta contínua pela transcrição da Groq (além do detector próprio),
            com variações de pronúncia, porteiro de ruído e mensagens claras para limite de uso, chave
            recusada, falha de rede e permissão de microfone; menu Informações (aparelho, clima e
            manchetes) aberto por botão, barra lateral e por voz; conversa em tela própria, com o
            histórico inteiro e sem mensagens ou falas duplicadas; e conjunto coeso de animações
            (verificação do sistema, ondas de voz, transições de tela e de status).

            **Novidades da 1.13.0:** o Picovoice saiu do projeto e a palavra de ativação passou a ser
            um detector próprio (reconhecimento do Android + regras de fonética locais), sem chave e
            sem SDK de terceiro, com sensibilidade ajustável, tolerância a sotaque e porteiro de ruído;
            roteador de motores no núcleo Hermes (Groq, Cerebras, Mistral e Gemini) escolhido por tipo de
            tarefa, latência medida e disponibilidade, com fallback automático; câmera que reconhece
            objetos e mostra balões informativos sobre a imagem; diagnóstico ampliado (câmera, chaves e
            motores); e área de mensagens com estado de carregamento e legibilidade.

            **Novidades da 1.12.0:** núcleo Hermes Agent decidindo toda resposta, briefing diário
            (temperatura e manchetes) no primeiro “bom dia”, autodiagnóstico por voz com resumo falado
            e abertura que só libera o app depois de reconhecer a sua voz.

            **1.10.1:** correções de estabilidade do segundo plano (player, vigia, escuta em espera e lembretes após reiniciar).
